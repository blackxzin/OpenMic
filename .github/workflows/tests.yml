name: Tests

# Runs on every push and PR: the release workflow only proves the apps
# *build*, which says nothing about the protocol, pairing, jitter buffer or
# audio-source authorization actually still working.
on:
  push:
  pull_request:

jobs:
  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        # PySide6 needs the GL/EGL stack even under QT_QPA_PLATFORM=offscreen,
        # sounddevice loads libportaudio at import time, and opuslib dlopens
        # libopus — all three are imported by the modules under test.
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libportaudio2 libopus0 \
            libxkbcommon-x11-0 libdbus-1-3

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
          # keyring has no usable backend on a headless runner; SecretStore
          # falls back to its derived-key path, which is what we want to
          # exercise here anyway.
          PYTHON_KEYRING_BACKEND: keyring.backends.fail.Keyring
        run: pytest -q --cov=openmic --cov-report=term-missing

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test
