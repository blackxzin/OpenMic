name: Release

# Builds the Android APK and Linux AppImage and publishes them to a GitHub
# Release whenever a version tag (vX.Y.Z) is pushed. iOS is compile-checked
# only (see ios-build-check.yml) since we don't have an Apple Developer
# account to sign/distribute it yet.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Decode release keystore
        working-directory: mobile/android
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > app/openmic-release-key.jks
          cat > key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=openmic
          storeFile=openmic-release-key.jks
          EOF

      - working-directory: mobile
        run: flutter pub get

      - working-directory: mobile
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        # libopus0/libportaudio2 are bundled into the AppImage by
        # build_appimage.sh, so they have to exist on the builder.
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libopus0 libportaudio2

      - working-directory: desktop
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - name: Build AppImage
        working-directory: desktop
        # appimagetool needs FUSE to run as a self-mounting AppImage; CI
        # runners don't reliably have it available, so extract-and-run
        # instead of mounting.
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: ./packaging/build_appimage.sh

      - name: Build .deb
        working-directory: desktop
        run: ./packaging/build_deb.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: desktop/dist/OpenMic-x86_64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: desktop/dist/*.deb

  check-ios-still-builds:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign

  publish-release:
    needs: [build-android, build-linux, check-ios-still-builds]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-assets

      - uses: actions/download-artifact@v4
        with:
          name: linux-appimage
          path: release-assets

      - uses: actions/download-artifact@v4
        with:
          name: linux-deb
          path: release-assets

      - name: Rename assets
        working-directory: release-assets
        run: mv app-release.apk OpenMic.apk

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/OpenMic.apk
            release-assets/OpenMic-x86_64.AppImage
            release-assets/openmic_*_amd64.deb
          generate_release_notes: true
