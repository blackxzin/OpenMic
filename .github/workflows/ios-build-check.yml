name: iOS build check

# We have no Mac to build/test iOS locally, so this just verifies the app
# still compiles for iOS on every push. It does NOT sign or produce a
# distributable .ipa — that needs an Apple Developer account, which this
# project doesn't have yet.
on:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/ios-build-check.yml"
  pull_request:
    paths:
      - "mobile/**"

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - run: flutter build ios --no-codesign --simulator
