name: iOS build check

# We have no Mac to build/test iOS locally, so this just verifies the app
# still compiles for iOS on every push. It does NOT sign or produce a
# distributable .ipa — that needs an Apple Developer account, which this
# project doesn't have yet.
on:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/ios-build-check.yml"
  pull_request:
    paths:
      - "mobile/**"

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # clean before pub get, not after: `flutter clean` deletes
      # ios/Flutter/Generated.xcconfig, which the Podfile's pod install
      # step reads FLUTTER_ROOT from — running clean last left that file
      # missing and pod install failed with "must exist ... run flutter
      # pub get first" every time.
      - run: flutter clean

      - run: flutter pub get

      - name: Fresh pod install
        run: |
          rm -rf ios/Pods ios/Podfile.lock
          cd ios
          pod repo update
          pod install

      - run: flutter build ios --no-codesign --simulator
